<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИН · Гарын дохиогоор тулалд</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:20px 16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none;text-align:center}
h1{margin:0;font-size:clamp(48px,11vw,96px);letter-spacing:.18em;padding-left:.18em;text-shadow:0 0 18px #35c8ff,0 0 48px #2a6bff}
.sub{margin-top:4px;font-size:clamp(13px,3.4vw,18px);opacity:.85;letter-spacing:.08em}
#label{min-height:26px;font-size:18px;color:#ffb866;text-shadow:0 0 12px #ff8a1f}
#menu{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;pointer-events:auto}
button,input{font:inherit;border-radius:999px;border:1px solid #35c8ff88;color:#fff;background:#0b1226cc;padding:13px 26px;font-size:16px;backdrop-filter:blur(6px)}
button{cursor:pointer;font-weight:700;touch-action:manipulation;transition:.15s}
button:hover{background:#35c8ff33;box-shadow:0 0 22px #35c8ffaa}
button.main{background:linear-gradient(135deg,#35c8ff,#2a6bff);border:0;box-shadow:0 0 26px #35c8ff99}
input{width:120px;text-align:center;text-transform:uppercase;letter-spacing:.2em}
input::placeholder{letter-spacing:0;opacity:.6}
#viewer{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000d;backdrop-filter:blur(6px)}
#viewer img{width:min(74vw,380px);aspect-ratio:1;object-fit:cover;border-radius:18px;border:2px solid #35c8ff;box-shadow:0 0 40px #35c8ff88}
#viewer h2{margin:0;font-size:26px;color:#ffb866;text-shadow:0 0 14px #ff8a1f}
#vnav{display:flex;gap:10px}
#guide{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000e;backdrop-filter:blur(6px);padding:16px}
#guide img{max-width:min(96vw,1000px);max-height:78vh;border-radius:14px;box-shadow:0 0 40px #35c8ff66}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
</style>
</head>
<body>
<div id="ui">
  <div><h1>ИН</h1><div class="sub">Гарын дохиогоор тулалд · 印</div></div>
  <div id="label"></div>
  <div id="menu">
    <button class="main" id="bCreate">Тулаан эхлүүлэх</button>
    <input id="code" maxlength="6" placeholder="Өрөөний код">
    <button id="bJoin">Нэгдэх</button>
    <button id="bLearn">Дохио сурах</button>
  </div>
</div>
<div id="viewer"><img id="signImg" alt=""><h2 id="signName"></h2><div id="vnav"><button id="vPrev">‹</button><button id="vClose">Хаах</button><button id="vNext">›</button></div></div>
<div id="guide"><img id="guideImg" alt="14 дохио"><button id="gClose">Хаах</button></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Тоглоомын логиктой холбох цэгүүд: эдгээрийг өөрийн Socket.IO кодоор солино ===== */
const HOOKS={
  create(){toast('Энд өрөө үүсгэж (socket.emit) тоглоом руу шилжинэ')},
  join(code){toast('Өрөө '+code+' руу нэгдэнэ (socket.emit)')},
  learn(){openGuide()}
};
const $=id=>document.getElementById(id);
let tt;function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2600)}
$('bCreate').onclick=()=>HOOKS.create();
$('bLearn').onclick=()=>HOOKS.learn();
$('bJoin').onclick=()=>{const c=$('code').value.trim();c?HOOKS.join(c.toUpperCase()):toast('Өрөөний кодоо бичнэ үү')};
let surge=0;
document.querySelectorAll('button').forEach(b=>{b.onmouseenter=()=>surge=1;b.onmouseleave=()=>surge=0});

/* ===== 3D ===== */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x05060d);S.fog=new THREE.Fog(0x05060d,12,30);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
function fit(){cam.aspect=innerWidth/innerHeight;cam.position.z=cam.aspect<1?17:11.5;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)}
fit();addEventListener('resize',fit);

const add=(g,m)=>{const x=new THREE.Mesh(g,m);S.add(x);return x};
const glow=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});
const core=add(new THREE.SphereGeometry(.9,32,24),glow(0xbfeaff));
const halo=add(new THREE.SphereGeometry(1.7,32,24),new THREE.MeshBasicMaterial({color:0x35c8ff,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false}));
const rings=[0x35c8ff,0xff8a1f,0x6a8bff].map((c,i)=>{const m=add(new THREE.TorusGeometry(1.5+i*.45,.025,8,80),glow(c));m.rotation.set(i*1.1,i*.7,0);return m});

/* Оригинал ninja баатар (primitive хэлбэрээс) */
S.add(new THREE.AmbientLight(0x8899cc,.9));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(3,5,6);S.add(dl);
const bl=new THREE.PointLight(0xff8a1f,1.5,12);bl.position.set(-3,2,-2);S.add(bl);
core.position.set(0,.2,-.9);halo.position.copy(core.position);
const nin=new THREE.Group();nin.position.y=-1.9;S.add(nin);
const M=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
const jacket=M(0x1d3557),skin=M(0xf0c8a0),dark=M(0x0e1424),red=M(0xd9323f);
const part=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);nin.add(o);return o};
const limb=(a,b,r,m)=>{const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),m);o.position.copy(A).add(B).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());nin.add(o)};
[-.22,.22].forEach(x=>part(new THREE.CylinderGeometry(.17,.15,1,10),dark,x,.5,0));
part(new THREE.CylinderGeometry(.42,.36,1.1,14),jacket,0,1.55,0);
part(new THREE.CylinderGeometry(.38,.38,.14,14),M(0xeeeeee),0,1.0,0);
part(new THREE.CylinderGeometry(.3,.3,.16,14),red,0,2.0,0);
part(new THREE.SphereGeometry(.38,20,16),skin,0,2.4,0);
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,k=i%2,h=.55+k*.35+Math.random()*.1,r=.2+k*.05,c=part(new THREE.ConeGeometry(.11,h,6),M(k?0xe9f2ff:0xaab9d6),Math.cos(a)*r,2.75+h*.1,Math.sin(a)*r-.02);c.rotation.set(Math.sin(a)*(.6+k*.3),0,-Math.cos(a)*(.6+k*.3))}
part(new THREE.TorusGeometry(.41,.015,6,32),glow(0x35c8ff),0,1.75,0).rotation.x=Math.PI/2;
part(new THREE.TorusGeometry(.39,.015,6,32),glow(0x35c8ff),0,1.35,0).rotation.x=Math.PI/2;

{const g=pc.getContext('2d');g.fillStyle='#c9d3e3';g.fillRect(0,0,128,80);g.fillStyle='#233a8a';g.font='bold 64px "Noto Sans JP","Yu Gothic",serif';g.textAlign='center';g.fillText('印',64,62)}
part(new THREE.PlaneGeometry(.3,.19),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(pc)}),0,2.52,.4);
[-.14,.14].forEach(x=>part(new THREE.SphereGeometry(.055,10,8),new THREE.MeshBasicMaterial({color:0x7fe3ff}),x,2.38,.34));
[-1,1].forEach(s=>{limb([s*.5,1.95,0],[s*.62,1.55,.4],.12,jacket);limb([s*.62,1.55,.4],[s*.05,1.8,.7],.1,jacket);part(new THREE.SphereGeometry(.09,10,8),skin,s*.04,1.8,.72)});
const scarf=[];for(let i=0;i<7;i++)scarf.push(part(new THREE.BoxGeometry(.5-i*.03,.14,.3),red,0,2,-.3));
const orb=new THREE.Group();orb.position.set(0,1.85,.97);nin.add(orb);
orb.add(new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),glow(0xffffff)));
orb.add(new THREE.Mesh(new THREE.SphereGeometry(.32,20,14),new THREE.MeshBasicMaterial({color:0x35c8ff,transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false})));
const oR=[0x35c8ff,0xff8a1f].map((c,i)=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.3+i*.08,.012,6,40),glow(c));orb.add(r);return r});
const oL=new THREE.PointLight(0x35c8ff,1.2,5);orb.add(oL);
const floor=new THREE.Mesh(new THREE.RingGeometry(.9,1.25,48),glow(0x35c8ff));floor.rotation.x=-Math.PI/2;floor.position.y=.02;nin.add(floor);

/* чакрын спираль бөөмс */

for(let i=0;i<N;i++){const a=i*.35,r=.8+i/N*6.5,j=(Math.random()-.5)*.5;
  P.set([Math.cos(a)*r+j,(Math.random()-.5)*1.2*(1+r*.1),Math.sin(a)*r+j],i*3);
  (i%2?cA:cB).toArray(C,i*3)}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(P,3));pg.setAttribute('color',new THREE.BufferAttribute(C,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.07,vertexColors:true,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
S.add(pts);

function tex(k,n){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#0b1226';g.strokeStyle='#35c8ff';g.lineWidth=6;
  g.beginPath();g.roundRect?g.roundRect(8,8,240,240,28):g.rect(8,8,240,240);g.fill();g.stroke();
  g.fillStyle='#fff';g.textAlign='center';g.shadowColor='#35c8ff';g.shadowBlur=18;
  g.font=(k.length>1?'bold 84px':'bold 130px')+' "Noto Sans JP","Yu Gothic","Hiragino Sans",serif';g.fillText(k,128,k.length>1?140:150);
  g.shadowBlur=0;g.fillStyle='#ffb866';g.font='bold 28px system-ui,sans-serif';g.fillText(n,128,222);
  return new THREE.CanvasTexture(c)}
const ring=new THREE.Group();ring.rotation.x=.38;S.add(ring);

  const m=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5),new THREE.MeshBasicMaterial({map:tex(s[0],s[1]),transparent:true}));

let cur=0;
function showSign(i){cur=(i+SIGNS.length)%SIGNS.length;$('signImg').src=IMGS[IDS[cur]];$('signName').textContent=SIGNS[cur][0]+' · '+SIGNS[cur][1];$('viewer').style.display='flex'}

$('vClose').onclick=closeSign;$('vPrev').onclick=()=>showSign(cur-1);$('vNext').onclick=()=>showSign(cur+1);
$('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeSign()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSign();if($('viewer').style.display==='flex'){if(e.key==='ArrowLeft')showSign(cur-1);if(e.key==='ArrowRight')showSign(cur+1)}});
R.domElement.addEventListener('click',e=>{
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,cam);const h=ray.intersectObjects(tiles)[0];
  if(h)showSign(h.object.userData.i);
});
let t=0,last=performance.now(),hov=null,boost=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  boost+=(surge-boost)*Math.min(1,dt*5);
  ring.rotation.y+=dt*(.18+boost*.5);
  pts.rotation.y-=dt*(.12+boost*.6);
  rings.forEach((m,i)=>{m.rotation.x+=dt*(.5+i*.2+boost);m.rotation.y+=dt*(.4-i*.15)});
  nin.position.y=-1.9+Math.sin(t*2)*.04;nin.rotation.y+=(mx*.5-nin.rotation.y)*dt*3;
  scarf.forEach((s,i)=>s.position.set(Math.sin(t*3+i*.7)*.08*i,2-i*.04+Math.sin(t*4+i)*.03,-.3-i*.28));
  orb.scale.setScalar(1+.12*Math.sin(t*6)+boost*.6);oR.forEach((r,i)=>{r.rotation.x+=dt*(3+i*2);r.rotation.y+=dt*(2-i)});oL.intensity=1.2+boost*2;floor.scale.setScalar(1+.05*Math.sin(t*3)+boost*.2);
  const pulse=1+.08*Math.sin(t*3)+boost*.35;core.scale.setScalar(pulse);halo.scale.setScalar(pulse*(1+.1*Math.sin(t*2)));
  ray.setFromCamera(mouse,cam);
  const hit=ray.intersectObjects(tiles)[0];
  hov=hit?hit.object:null;
  $('label').textContent=hov?hov.userData.name+' · '+hov.userData.kanji:'Хавтан дээр дарж дохиог хар';
  tiles.forEach(m=>{
    const u=m.userData,a=u.a;
    m.position.set(Math.cos(a)*4.6,Math.sin(t*1.2+a*3)*.12,Math.sin(a)*4.6);
    m.quaternion.copy(cam.quaternion);
    const wz=m.getWorldPosition(new THREE.Vector3()).z;
    m.material.opacity=THREE.MathUtils.clamp(.55+wz/10,.35,1);
    u.sc+=((m===hov?1.35:1)-u.sc)*Math.min(1,dt*10);m.scale.setScalar(u.sc);
  });
  cam.position.x+=(mx*1.2-cam.position.x)*dt*2;
  cam.position.y+=(1.6+my*.8-cam.position.y)*dt*2;
  cam.lookAt(0,0,0);
  R.render(S,cam);
}
requestAnimationFrame(loop);
</script>
</body>
